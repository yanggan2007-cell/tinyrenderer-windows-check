name: windows-check
on:
  workflow_dispatch:   # run by hand (Actions tab -> windows-check -> Run workflow); a full run uses many Windows runner minutes
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [authors-msvc, authors-clang, authors-clang-noomp, authors-extra, flow, handbook, probe, arch, arch2, arch3, arch4]   # ao-small / ao-full take 7 / 65 minutes, add them when needed
    steps:
      - uses: actions/checkout@v4
      - name: Python packages
        shell: pwsh
        run: python -m pip install --quiet pillow
      - name: Run checks (${{ matrix.part }})
        shell: pwsh
        run: ./ci/run.ps1 -part ${{ matrix.part }} *>&1 | Tee-Object -FilePath job-console.txt
        continue-on-error: true
      - name: Publish results to a branch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          if (Test-Path job-console.txt) { Copy-Item job-console.txt results/job-console-${{ matrix.part }}.txt }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $branch = "results-${{ github.run_number }}-${{ matrix.part }}"
          git checkout --orphan $branch
          git rm -r -q --cached .
          git add -f results
          git commit -q -m "results of run ${{ github.run_number }} (${{ matrix.part }}) for ${{ github.sha }}"
          git push -q origin $branch
